<div class="pt-2 w-full shrink-0 border-outline transition-transform duration-300"
:class="{ 'shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] border-t ' : isOpen('user') }"
>


  <div class="subitems-container upward"
  x-show="isOpen('user') && isSidebarVisible"
  x-cloak
x-collapse.duration.250ms
  >
 <button
 @click="$store.theme.toggle()"
 type="button"
 class="subitem"
 role="menuitem"
 >
 <div class="label-container">
 <span x-text="$store.theme.darkMode ? 'Modo Claro' : 'Modo Escuro'"></span>
 <div class="relative size-3.5">
 <i data-lucide="sun"
 class="size-3.5 absolute inset-0"
 x-show="!$store.theme.darkMode"
 x-transition:enter="transition ease-out duration-200"
 x-transition:enter-start="opacity-0 scale-0"
 x-transition:enter-end="opacity-100 scale-100"
 x-transition:leave="transition ease-in duration-200"
 x-transition:leave-start="opacity-100 scale-100"
 x-transition:leave-end="opacity-0 scale-0"
 ></i>
 <i data-lucide="moon"
 class="size-3.5 absolute inset-0"
 x-show="$store.theme.darkMode"
 x-transition:enter="transition ease-out duration-200"
 x-transition:enter-start="opacity-0 scale-0"
 x-transition:enter-end="opacity-100 scale-100"
 x-transition:leave="transition ease-in duration-200"
 x-transition:leave-start="opacity-100 scale-100"
 x-transition:leave-end="opacity-0 scale-0"
 ></i>
 </div>
 </div>
 </button>

 <button
 hx-post="/logout" hx-indicator="closest form"
 type="button"
 class="subitem"
 role="menuitem"
 >
 <div class="label-container">
 <span>Logout</span>
 <i data-lucide="log-out" class="size-3.5"></i>
 </div>
 </button>

 <a
 href="#"
 class="subitem"
 role="menuitem"
 >
 <div class="label-container">
 <span>Settings</span>
 <span class="text-xs text-on-surface/50 italic">coming soon</span>
 </div>
 </a>

 <a
 href="#"
 class="subitem"
 role="menuitem"
 >
 <div class="label-container">
 <span>Sign Out</span>
 </div>
 </a>
 </div>


 <div class="px-2 5">
 <button
 class="item collapsible-item"
 @click="toggleSubitem('user'); $store.sidebar.isSidebarOpen = true"
 :class="{ 'active' : isOpen('user') }"
 :aria-expanded="isOpen('user')"
 >
 <div class="label-container">
 <i data-lucide="circle-user-round" class="size-5 shrink-0"></i>

  <div class="title"
  x-show="isSidebarVisible"
  x-transition:enter="transition-all ease-out duration-200 delay-75"
  x-transition:enter-start="opacity-0 -translate-x-2"
  x-transition:enter-end="opacity-100 translate-x-0"
  x-transition:leave="transition-all ease-in duration-100"
  x-transition:leave-start="opacity-100 translate-x-0"
  x-transition:leave-end="opacity-0 -translate-x-2"
  x-cloak
  >
 <span>{{user.name}}</span>
 </div>
 <i data-lucide="chevron-down"
  class="chevron" :class="{ 'open': isOpen('user') }"
  ></i>
 </div>
 </button>
 </div>

</div>
