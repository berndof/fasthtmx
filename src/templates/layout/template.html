{% extends "core/base_shell.html" %}

{% block body %}
<div x-data class="body-container overflow-hidden">
    {% include "partials/header.html" %}

    <div class="flex flex-row grow pb-4 pr-4 overflow-y-auto">
        {% include "partials/sidebar.html" %}

        <div class="content-border min-w-0 flex-1">
            <div class="content-container relative">
                <div id="content-loading">
                    <div class="h-full rounded-full" style="background: linear-gradient(90deg, transparent, var(--color-primary) 30%, var(--color-accent) 70%, transparent);"></div>
                </div>

                <div id="content">
                    {% block content %}{% endblock content %}
                </div>
            </div>
        </div>
    </div>
</div>
{% include "partials/notification.html" %}
{% endblock body %}
