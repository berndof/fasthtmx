{% extends "base.html" %}

{% block title %}
<title>{{ "Editar" if ramal else "Novo" }} Ramal — Admin — Torres SCC</title>
{% endblock title %}

{% block content %}
<div class="flex-1 p-4 lg:p-6">
    <div class="max-w-lg mx-auto">

        <div class="mb-6">
            <a href="/admin/ramais" class="text-sm text-gray-600 hover:text-gray-900">&larr; Voltar</a>
            <h1 class="text-2xl font-bold text-gray-900 mt-2">
                {{ "Editar" if ramal else "Novo" }} Ramal
            </h1>
        </div>

        <form method="post" class="space-y-4">
            <div>
                <label for="regiao_id" class="block text-sm font-medium text-gray-700 mb-1">Região</label>
                <select name="regiao_id" id="regiao_id" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-black/20 focus:border-black">
                    <option value="">Selecione...</option>
                    {% for r in regioes %}
                    <option value="{{ r.id }}" {{ 'selected' if ramal and ramal.regiao_id == r.id else '' }}>
                        {{ r.nome }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="nome" class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
                <input type="text" name="nome" id="nome" required
                       value="{{ ramal.nome if ramal else '' }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-black/20 focus:border-black">
            </div>

            <div>
                <label for="numero" class="block text-sm font-medium text-gray-700 mb-1">Número</label>
                <input type="text" name="numero" id="numero" required
                       value="{{ ramal.numero if ramal else '' }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-black/20 focus:border-black">
            </div>

            <div>
                <label for="ordem" class="block text-sm font-medium text-gray-700 mb-1">Ordem</label>
                <input type="number" name="ordem" id="ordem" min="0"
                       value="{{ ramal.ordem if ramal else 0 }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-black/20 focus:border-black">
            </div>

            <div class="flex gap-3">
                <button type="submit"
                        class="px-4 py-2 text-sm font-medium text-white bg-black rounded-md hover:bg-gray-800 transition-colors">
                    {{ "Salvar" if ramal else "Criar" }}
                </button>
                <a href="/admin/ramais"
                   class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 border border-gray-300 rounded-md hover:bg-gray-200 transition-colors">
                    Cancelar
                </a>
            </div>
        </form>

    </div>
</div>
{% endblock content %}
