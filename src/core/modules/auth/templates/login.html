{% extends "base.html" %}

{% block topbar %}{% endblock %}

{% block content %}
<div class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-sm">

        <div class="p-6 bg-white border border-gray-300 rounded-md shadow-sm">
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-full bg-black text-white flex items-center justify-center mx-auto mb-3">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
                <h1 class="text-xl font-bold text-gray-900">Torres SCC</h1>
                <p class="text-sm text-gray-500 mt-1">Faça login para continuar</p>
            </div>

            <form action="/login" method="post" class="space-y-4">
                {% if error %}
                <p class="text-sm text-red-600 bg-red-50 border border-red-200 px-3 py-2 rounded-md">{{ error }}</p>
                {% endif %}

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        {% if ldap_enabled %}Usuário{% else %}Email{% endif %}
                    </label>
                    <input type="text" name="username" placeholder="{% if ldap_enabled %}seu.usuario{% else %}seu@email.com{% endif %}" required autofocus
                           class="w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-black/20 focus:border-black transition-all">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input type="password" name="password" placeholder="Sua senha" required
                           class="w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-black/20 focus:border-black transition-all">
                </div>

                <button type="submit"
                        class="w-full px-4 py-2 bg-black text-white text-sm font-medium rounded-md hover:bg-gray-800 transition-colors">
                    Entrar
                </button>
            </form>
        </div>

        <p class="text-center mt-4">
            <a href="/home" class="text-sm text-gray-500 hover:text-gray-900 transition-colors">
                Continuar como convidado
            </a>
        </p>

    </div>
</div>
{% endblock content %}
