<section x-data="linksExternosPanel()">
    <h2 class="text-xl font-semibold mb-4 flex items-center text-gray-800 gap-3">
        <i data-lucide="external-link" class="text-blue-500"></i>
        Links Úteis
    </h2>

    <div class="relative border border-outline rounded-2xl overflow-hidden scroll-hint">
        <div class="grid grid-cols-4 grid-rows-[auto_auto] grid-flow-col gap-4 p-5 overflow-x-auto thin-scrollbar">
            <template x-for="item in items" :key="item.id">
                <a :href="item.href"
                   target="_blank" rel="noopener noreferrer"
                   class="flex flex-col items-center gap-2 no-underline group">
                    <div class="w-20 h-20 rounded-2xl flex items-center justify-center overflow-hidden shadow-[0_4px_10px_-2px_rgba(0,0,0,0.08)] group-hover:shadow-[0_6px_16px_-4px_rgba(0,0,0,0.15)] group-hover:-translate-y-0.5 transition-all duration-200"
                         :class="item.bgClass">
                        <img :src="item.favicon_url"
                             @error="$el.style.display='none'; $el.nextElementSibling.style.display='flex'"
                             class="w-8 h-8 object-contain"
                             alt="">
                        <span class="hidden w-full h-full items-center justify-center text-lg font-bold"
                              :class="item.textClass" x-text="item.abbr"></span>
                    </div>
                    <span class="text-xs font-medium text-gray-700 text-center leading-tight px-1" x-text="item.name"></span>
                </a>
            </template>
        </div>
    </div>

    <script>
        function linksExternosPanel() {
            return { items: {{ quick_access_items | tojson }} }
        }
    </script>
</section>
