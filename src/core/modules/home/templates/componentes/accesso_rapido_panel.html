<section x-data="accessPanel()">
    <h2 class="text-xl font-semibold mb-4 flex items-center text-gray-800 gap-4">
        <i data-lucide="zap" class="text-blue-500"></i>
        Acesso Rápido
    </h2>

    <div class="relative border border-outline rounded-radius overflow-hidden">
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 p-4 max-h-60 overflow-y-auto thin-scrollbar">
            <template x-for="item in sortedItems" :key="item.id">
                <div class="relative group"
                    :draggable="!item.is_special"
                    @dragstart="handleDragStart($event, item.id)"
                    @dragover.prevent="handleDragOver($event, item.id)"
                    @drop="handleDrop($event, item.id)"
                    @dragleave="dragOverItem = null"
                    @dragend="handleDragEnd()"
                    :class="{'ring-2 ring-sky-400': dragOverItem === item.id}"
                >
                    <a :href="item.href" class="flex flex-col items-center gap-2 p-4 bg-gray-50 border border-gray-300 rounded-md hover:border-gray-900 hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200">
                        <span class="w-10 h-10 rounded-md flex items-center justify-center text-lg font-bold" :class="item.bgClass + ' ' + item.textClass" x-text="item.abbr"></span>
                        <span class="text-sm font-medium text-gray-900" x-text="item.name"></span>
                    </a>

                    <template x-if="!item.is_special">
                        <button @click.prevent="toggleFavorite(item.id)" class="absolute -top-1.5 -right-1.5 w-6 h-6 rounded-full bg-white border border-gray-300 shadow-sm flex items-center justify-center transition-opacity duration-200" :class="hasFavorites ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'">
                            <svg class="w-3.5 h-3.5" :class="isFavorited(item.id) ? 'text-amber-500' : 'text-gray-400'" :fill="isFavorited(item.id) ? 'currentColor' : 'none'" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                            </svg>
                        </button>
                    </template>
                </div>
            </template>
        </div>
    </div>

    <script>
        function accessPanel() {
            return {
                items: {{ quick_access_items | tojson }},
                favorites: JSON.parse(localStorage.getItem('accessPanelFavorites') || '[]'),
                order: JSON.parse(localStorage.getItem('accessPanelOrder') || '[]'),
                draggedItem: null,
                dragOverItem: null,

                get hasFavorites() {
                    return this.favorites.length > 0;
                },

                get sortedItems() {
                    const more = this.items.filter(i => i.is_special);
                    const regular = this.items.filter(i => !i.is_special);
                    const favs = regular.filter(i => this.favorites.includes(i.id));
                    const nonFavs = regular.filter(i => !this.favorites.includes(i.id));

                    const sortByOrder = (arr) => [...arr].sort((a, b) => {
                        const aIdx = this.order.indexOf(a.id);
                        const bIdx = this.order.indexOf(b.id);
                        if (aIdx !== -1 && bIdx !== -1) return aIdx - bIdx;
                        if (aIdx !== -1) return -1;
                        if (bIdx !== -1) return 1;
                        return 0;
                    });

                    return [...sortByOrder(favs), ...sortByOrder(nonFavs), ...more];
                },

                toggleFavorite(id) {
                    if (this.favorites.includes(id)) {
                        this.favorites = this.favorites.filter(f => f !== id);
                    } else {
                        this.favorites.push(id);
                    }
                    localStorage.setItem('accessPanelFavorites', JSON.stringify(this.favorites));
                },

                isFavorited(id) {
                    return this.favorites.includes(id);
                },

                handleDragStart(event, id) {
                    this.draggedItem = id;
                    event.dataTransfer.effectAllowed = 'move';
                    event.dataTransfer.setData('text/plain', id);
                },

                handleDragOver(event, id) {
                    if (!this.draggedItem || id === this.draggedItem) {
                        event.dataTransfer.dropEffect = 'none';
                        return;
                    }
                    const draggedIsFav = this.favorites.includes(this.draggedItem);
                    const targetIsFav = this.favorites.includes(id);
                    if (draggedIsFav !== targetIsFav) {
                        event.dataTransfer.dropEffect = 'none';
                        return;
                    }
                    this.dragOverItem = id;
                    event.dataTransfer.dropEffect = 'move';
                },

                handleDrop(event, id) {
                    event.preventDefault();
                    this.dragOverItem = null;
                    if (!this.draggedItem || this.draggedItem === id) return;

                    const draggedIsFav = this.favorites.includes(this.draggedItem);
                    const targetIsFav = this.favorites.includes(id);
                    if (draggedIsFav !== targetIsFav) return;

                    const newOrder = this.order.filter(i => i !== this.draggedItem);
                    const insertIdx = newOrder.indexOf(id);
                    newOrder.splice(insertIdx >= 0 ? insertIdx : newOrder.length, 0, this.draggedItem);
                    this.order = newOrder;
                    localStorage.setItem('accessPanelOrder', JSON.stringify(this.order));
                    this.draggedItem = null;
                },

                handleDragEnd() {
                    this.draggedItem = null;
                    this.dragOverItem = null;
                }
            }
        }
    </script>
</section>
