<form hx-post="/login" hx-target="closest form" hx-swap="outerHTML"
      class="p-4 space-y-3 w-72">
    {% if error %}
    <p class="text-sm text-red-600 bg-red-50 border border-red-200 px-3 py-2 rounded-md">{{ error }}</p>
    {% endif %}

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
            {% if ldap_enabled %}Usuário{% else %}Email{% endif %}
        </label>
        <input type="text" name="username"
               placeholder="{% if ldap_enabled %}seu.usuario{% else %}seu@email.com{% endif %}"
               required autofocus
               class="w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-black/20 focus:border-black transition-all">
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
        <input type="password" name="password" placeholder="Sua senha" required
               class="w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-black/20 focus:border-black transition-all">
    </div>

    <button type="submit"
            class="w-full px-4 py-2 bg-black text-white text-sm font-medium rounded-md hover:bg-gray-800 transition-colors">
        Entrar
    </button>

    <p class="text-center">
        <a href="/home" class="text-xs text-gray-500 hover:text-gray-900 transition-colors">
            Continuar como convidado
        </a>
    </p>
</form>
