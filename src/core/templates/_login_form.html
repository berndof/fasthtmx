<form hx-post="/login" hx-target="closest form" hx-swap="outerHTML"
      class="p-5 space-y-4 w-72">
    <div class="text-center pb-1">
        <p class="text-sm font-semibold text-gray-900">Acesse sua conta</p>
        <p class="text-xs text-gray-500 mt-0.5">Informe seus dados para entrar</p>
    </div>

    {% if error %}
    <p class="text-sm text-red-600 bg-red-50 border border-red-200 px-3 py-2 rounded-md">{{ error }}</p>
    {% endif %}

    <div>
        <label class="block text-xs font-medium text-gray-600 mb-1 uppercase tracking-wide">
            {% if ldap_enabled %}Usuário{% else %}Email{% endif %}
        </label>
        <input type="text" name="username"
               placeholder="{% if ldap_enabled %}seu.usuario{% else %}seu@email.com{% endif %}"
               required autofocus
               class="w-full px-3 py-2.5 bg-gray-50 border border-gray-300 rounded-md text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#004a8f]/20 focus:border-[#004a8f] transition-all">
    </div>

    <div>
        <label class="block text-xs font-medium text-gray-600 mb-1 uppercase tracking-wide">Senha</label>
        <input type="password" name="password" placeholder="Sua senha" required
               class="w-full px-3 py-2.5 bg-gray-50 border border-gray-300 rounded-md text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#004a8f]/20 focus:border-[#004a8f] transition-all">
    </div>

    <button type="submit"
            class="w-full px-4 py-2.5 bg-[#004a8f] text-white text-sm font-semibold rounded-md hover:bg-[#003a72] transition-colors shadow-sm">
        Entrar
    </button>

    {# <p class="text-center pt-1">
        <a href="/home" class="text-xs text-gray-400 hover:text-[#004a8f] transition-colors">
            Continuar como convidado →
        </a>
    </p> #}
</form>
