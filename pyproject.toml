[project]
name = "fasthtmx"
version = "0.2.0"
description = "Explicit FastAPI + HTMX + Alpine + Jinja2 web framework and starter"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.2",
    "aiosqlite>=0.22.1",
    "alembic>=1.17.2",
    "alembic-postgresql-enum>=1.9.0",
    "argon2>=0.1.10",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.123.0",
    "honcho>=2.0.0",
    "jinja2>=3.1.6",
    "jinja2-fragments>=1.11.0",
    "passlib>=1.7.4",
    "pyjwt>=2.10.1",
    "python-json-logger>=4.1.0",
    "python-multipart>=0.0.20",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "typer>=0.20.0",
    "uvicorn>=0.38.0",
]

[project.scripts]
fasthtmx = "cli.main:main"
help = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "cli"]

[tool.ruff]
lint.ignore = ["F401"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
